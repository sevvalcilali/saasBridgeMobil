name: yakinlik_mobil
description: "Yakınlık Panosu — saha görevlileri için mobil uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Uygulama ikonu: `flutter test tool/ikon_uret_test.dart` → assets/ikon/*.png, sonra `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/ikon/ikon.png"
  adaptive_icon_background: "#F7F2E9"
  adaptive_icon_foreground: "assets/ikon/ikon_on.png"
